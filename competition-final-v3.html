<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route to Own by บสย.</title><style>
:root{--n:#071a33;--b:#0d5eb8;--bg:#f4f8fb;--m:#65778a;--l:#dce7ef;--g:#16845d;--a:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#183047}button,select{font:inherit}.view{display:none;min-height:100vh}.view.active{display:block}.gate{padding:42px 6vw;background:linear-gradient(145deg,#fff,#edf7fb)}.brand{font-weight:900;color:var(--n);font-size:20px}.brand small{display:block;font-size:12px;color:var(--m);font-weight:600}.hero{max-width:850px;margin:70px auto 35px;text-align:center}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.08;margin:12px;color:var(--n)}.hero p{font-size:18px;color:var(--m);line-height:1.65}.tag{display:inline-block;border-radius:999px;padding:7px 10px;background:#e8f6fb;color:#08738b;font-size:11px;font-weight:900}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#eaf2f7;color:#274b64}.big{font-size:16px;padding:14px 20px}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1000px;margin:26px auto}.role{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;text-align:left;cursor:pointer}.role b{display:block;color:var(--n);font-size:17px}.role span{display:block;color:var(--m);font-size:13px;margin-top:5px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:18px 12px}.side .brand{color:#fff}.side .brand small{color:#b8cedf}.quick{display:grid;gap:5px;margin:18px 0}.quick button,.back{border:0;background:transparent;color:#d8e6ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.quick button.active,.quick button:hover{background:rgba(255,255,255,.12);color:#fff}.all{width:100%;padding:9px;border:0;border-radius:8px;margin-top:6px}.back{margin-top:16px;width:100%;border-top:1px solid rgba(255,255,255,.15);border-radius:0}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}.top b{color:var(--n)}.content{padding:24px;max-width:1350px;margin:auto}.head h2{font-size:28px;margin:0 0 6px;color:var(--n)}.head p{margin:0;color:var(--m)}.guide{margin:14px 0;background:#eef8fb;border:1px solid #cee8ef;border-radius:12px;padding:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;margin-bottom:12px}.metric small{color:var(--m)}.metric strong{display:block;font-size:22px;color:var(--n);margin-top:5px}.notice{background:#f0f8fb;border:1px solid #d2e8f0;border-radius:10px;padding:12px}.flow{display:flex;gap:6px;flex-wrap:wrap}.flow span{background:#eaf3f7;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:9px;border-bottom:1px solid #edf2f5;text-align:left;font-size:12px}th{font-size:10px;color:#60788b;background:#f8fafc}.scroll{overflow:auto;border:1px solid var(--l);border-radius:12px}.demo{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;width:min(860px,calc(100vw - 20px));background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 16px 40px #071a3326;padding:11px 13px;align-items:center;justify-content:space-between}.demo.show{display:flex}.demo small{display:block;color:var(--m)}.toast{position:fixed;right:18px;bottom:18px;background:var(--n);color:#fff;padding:12px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:11}.toast.show{opacity:1}.riskbox{margin:13px 0;background:linear-gradient(135deg,#fff,#f4faff);border:1px solid #cfe3f3;border-radius:14px;padding:14px}.riskhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.riskhead b{color:var(--n)}.riskhead small{display:block;color:var(--m);margin-top:3px;line-height:1.5}.riskgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.riskcard{background:#fff;border:1px solid #e1eaf1;border-radius:12px;padding:11px;min-width:0}.riskcard small{color:var(--m);font-size:10px;font-weight:700;display:block}.riskcard strong{display:block;margin-top:5px;color:var(--n);font-size:14px;line-height:1.35}.riskcard em{display:block;margin-top:4px;color:#7b8da0;font-size:10px;line-height:1.4;font-style:normal}.caseblock{border-top:1px solid #e5eef4;margin-top:12px;padding-top:12px}.casehead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px}.casehead b{color:var(--n)}.casehead span{color:var(--m)}.casegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.guard{margin-top:12px;background:#fff8e8;border:1px solid #f0ddb6;color:#795710;border-radius:10px;padding:10px 11px;font-size:11px;line-height:1.55}@media(max-width:850px){.roles,.grid,.riskgrid{grid-template-columns:1fr 1fr}.casegrid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:relative}.quick{grid-template-columns:1fr 1fr}.demo{display:none!important}}@media(max-width:480px){.roles,.grid,.quick,.riskgrid{grid-template-columns:1fr}.hero{margin-top:40px}.hero h1{font-size:40px}}
</style></head><body>
<section id="gateway" class="view gate active"><div class="brand">Route to Own by บสย.<small>Post-Approval Back Office</small></div><div class="hero"><span class="tag">COMPETITION MODE</span><h1>ดูระบบได้ใน 90 วินาที</h1><p>เงินวันนี้ → เห็นความเสี่ยง → ช่วยก่อนค้าง → ส่งให้ FI ตัดสิน → ติดตามคำขอชดเชย</p><button class="btn primary big" onclick="startDemo()">▶ เริ่มสาธิต 90 วินาที</button></div><div class="roles"><button class="role" onclick="go('driver','home')"><b>🚕 ผู้ขับ</b><span>เงินวันนี้ · ขอความช่วยเหลือ</span></button><button class="role" onclick="go('partner','overview')"><b>🏦 พาร์ทเนอร์</b><span>พอร์ต · EWS · Action</span></button><button class="role" onclick="go('tower','monitor')"><b>◉ Control Tower</b><span>เคสเสี่ยง · SLA · Owner</span></button><button class="role" onclick="go('fa','intake')"><b>F.A. Center</b><span>ช่วยก่อน NPL</span></button></div></section>
<section id="work" class="view"><div class="shell"><aside class="side"><div class="brand">Route to Own<small id="viewName"></small></div><div id="quick" class="quick"></div><label style="font-size:11px;color:#9fc0d5">ดูเมนูทั้งหมด</label><select id="all" class="all" onchange="jumpAll()"></select><button class="back" onclick="go('gateway')">← กลับหน้าปก</button></aside><main class="main"><div class="top"><b id="topTitle"></b><span class="tag">DEMO LIVE</span></div><div id="content" class="content"></div></main></div></section>
<div id="demo" class="demo"><div><b id="step"></b><small id="stepText"></small></div><div><button class="btn secondary" onclick="endDemo()">ออก</button> <button class="btn primary" onclick="nextDemo()">ถัดไป →</button></div></div><div id="toast" class="toast"></div>
<script>
const R={driver:['home','activity','money','ownership','wallet','help','cure'],partner:['overview','pipeline','portfolio','daily','incidents','ews','cure','elg','exit','claim','finance','partners'],tower:['monitor','queue','risk-map','fa-center','promptcure-sla','claim-monitor','data-health'],fa:['intake','interruption','debt-plan','income-plan','cases']};
const T={driver:{home:'วันนี้ของฉัน',activity:'รายได้และการขับขี่',money:'เงินของฉัน',ownership:'เส้นทางสู่เจ้าของ',wallet:'กระเป๋า Route to Own',help:'แจ้งเหตุ / ขอความช่วยเหลือ',cure:'ช่วยก่อนค้าง'},partner:{overview:'ภาพรวมพอร์ต',pipeline:'เปิดใช้งานหลังอนุมัติ',portfolio:'พอร์ตที่ใช้งาน',daily:'งานประจำวัน',incidents:'เหตุการณ์',ews:'สัญญาณเตือน',cure:'ช่วยก่อนค้าง / ส่ง FI',elg:'Child E-LG',exit:'ทางออก / ปรับโครงสร้าง',claim:'ติดตามคำขอชดเชย',finance:'การเงินโครงการ',partners:'พาร์ทเนอร์ / Audit'},tower:{monitor:'ภาพรวมความเสี่ยง',queue:'คิวงานเร่งด่วน','risk-map':'แผนที่ความเสี่ยง','fa-center':'F.A. Center','promptcure-sla':'SLA การช่วยเหลือ','claim-monitor':'ติดตามคำขอชดเชย','data-health':'สุขภาพข้อมูล'},fa:{intake:'รับเรื่อง',interruption:'รายได้สะดุด / รถหยุดวิ่ง','debt-plan':'แผนช่วยเหลือหนี้','income-plan':'แผนเพิ่มรายได้',cases:'ติดตามเคส'}};
const Q={driver:['home','help','cure','ownership'],partner:['overview','daily','ews','claim'],tower:['monitor','queue','fa-center','claim-monitor'],fa:['intake','cases','debt-plan','income-plan']};
const FLOW=[['driver','home','1. เงินวันนี้ของผู้ขับ'],['tower','monitor','2. ระบบเห็นเคสเสี่ยง'],['fa','cases','3. F.A. ช่วยก่อนค้าง'],['partner','cure','4. FI เป็นผู้ตัดสินเงื่อนไขสินเชื่อ'],['partner','claim','5. ติดตามคำขอชดเชย + Risk Reference']];let demo=false;
const REQUESTS=[{id:'CR-0011',status:'UNDER_REVIEW',evidence:'COMPLETE',recovery:'RECORDED',insurance:'COMPLETE',waiting:'TCG',next:'ติดตามผล',ead:null,eligibleNetLoss:null,hardMaxClaim:null},{id:'CR-0012',status:'MORE_INFO_REQUIRED',evidence:'PENDING',recovery:'IN_PROGRESS',insurance:'CHECKING',waiting:'FI',next:'รับเอกสาร',ead:null,eligibleNetLoss:null,hardMaxClaim:null}];
const PORTFOLIO_RISK={stopLossLimit:null,stopLossUtilizationPct:null,cumulativeEligibleNetLoss:null,status:'PENDING_POLICY_CONFIRMATION'};
const metric=(a,b,c='')=>`<div class="metric"><small>${a}</small><strong>${b}</strong><small>${c}</small></div>`;const grid=a=>`<div class="grid">${a.map(x=>metric(...x)).join('')}</div>`;const table=(h,r)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const pending=(v,t)=>typeof v==='number'&&Number.isFinite(v)?'฿'+v.toLocaleString('th-TH',{maximumFractionDigits:0}):t;const pct=v=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('th-TH',{maximumFractionDigits:1})+'%':'รอข้อมูลพอร์ต';
function riskReference(){const p=PORTFOLIO_RISK;return `<div class="riskbox" id="riskReference"><div class="riskhead"><div><b>ข้อมูลประกอบการพิจารณา · Risk / Claim Reference Data</b><small>EAD / Eligible Net Loss / HMC เป็นข้อมูลระดับรายคำขอ · Stop Loss เป็นตัวควบคุมระดับพอร์ต</small></div><span class="tag">REFERENCE ONLY</span></div><div class="riskgrid"><div class="riskcard"><small>Stop Loss Limit · เพดานพอร์ต</small><strong>${pending(p.stopLossLimit,'รอค่าเพดานโครงการ')}</strong><em>Portfolio Control — ไม่ใช่ค่าของเคส</em></div><div class="riskcard"><small>Stop Loss Utilization</small><strong>${pct(p.stopLossUtilizationPct)}</strong><em>การใช้ Risk Budget เทียบเพดานที่อนุมัติ</em></div><div class="riskcard"><small>Cumulative Eligible Net Loss</small><strong>${pending(p.cumulativeEligibleNetLoss,'รอข้อมูลพอร์ต')}</strong><em>ใช้มอนิเตอร์พอร์ต ไม่ใช่ยอดจ่ายรายเคส</em></div><div class="riskcard"><small>Policy Status</small><strong>รอยืนยันนโยบาย</strong><em>ต้องอ้างอิงเกณฑ์โครงการ/ผู้มีอำนาจ</em></div></div>${REQUESTS.map(r=>`<div class="caseblock"><div class="casehead"><b>${r.id}</b><span>${r.status} · รอ ${r.waiting}</span></div><div class="casegrid"><div class="riskcard"><small>EAD · Exposure at Default</small><strong>${pending(r.ead,'รอข้อมูลยืนยันจาก FI')}</strong><em>ยอดภาระคงค้าง ณ จุด Default</em></div><div class="riskcard"><small>Eligible Net Loss</small><strong>${pending(r.eligibleNetLoss,'รอข้อมูล Recovery / สิทธิ')}</strong><em>ความเสียหายสุทธิที่เข้าเกณฑ์หลัง Recovery ที่ยืนยันแล้ว</em></div><div class="riskcard"><small>HMC · Hard Max Claim</small><strong>${pending(r.hardMaxClaim,'รอเพดานตามเงื่อนไขโครงการ')}</strong><em>เพดานอ้างอิงของเคส ไม่ใช่ยอดอนุมัติจ่าย</em></div></div></div>`).join('')}<div class="guard"><b>Governance:</b> ข้อมูลชุดนี้เป็นข้อมูลประกอบการพิจารณาและกรอบควบคุมความเสี่ยง ไม่ใช่จำนวนเงินอนุมัติจ่ายอัตโนมัติ และระบบนี้ไม่สร้างสิทธิชดเชยแทนผู้มีอำนาจอนุมัติ</div></div>`}
function claimBody(){return `<div class="notice"><b>Tracking + Reference only</b> — ติดตามสถานะคำขอ พร้อม Risk Reference โดยไม่คำนวณสิทธิหรือจำนวนเงินชดเชยอัตโนมัติ</div>${riskReference()}`+table(['Case','Request Status','Evidence','Recovery','Insurance','Waiting','Next'],REQUESTS.map(r=>[r.id,r.status,r.evidence,r.recovery,r.insurance,r.waiting,r.next]));}
function body(v,s){if(v==='driver'&&s==='home')return grid([['รายได้ที่ยืนยันได้','฿1,715.50'],['เงินพร้อมใช้','฿638.05'],['หักจริงวันนี้','฿477.69'],['DPD จาก FI','0']])+`<div class="notice">ไม่หักวันที่ไม่มีรายได้ · Target ≠ Actual Sweep ≠ Contractual Due</div>`;if(v==='tower'&&s==='monitor')return grid([['ปกติ','450'],['เฝ้าระวัง','17'],['ต้องช่วย','9'],['เกิน SLA','6']])+table(['เคส','เหตุ','สถานะ','รอใคร'],[['INT-0451','รถหยุดวิ่ง','YELLOW','OEM'],['INT-0460','รายได้ลด','WATCH','F.A.']]);if(v==='fa'&&s==='cases')return table(['เคส','ผู้ขับ','เรื่อง','สถานะ','รอใคร','ถัดไป'],[['FA-1002','DRV-002','รายได้ลด','คัดกรอง','F.A.','แผน 7 วัน'],['CURE-005','DRV-005','ภาระหนี้','รอดำเนินการ','FI','FI Review']]);if(v==='partner'&&s==='cure')return `<div class="notice"><b>F.A. เสนอทางเลือก · FI ตัดสิน</b><br>DPD / Contractual Due / Restructure เป็นอำนาจของ FI</div><div class="actions"><button class="btn primary" onclick="say('ส่ง Recommendation ให้ FI แล้ว')">ส่งคำแนะนำให้ FI</button></div>`;if(v==='partner'&&s==='claim')return claimBody();if(v==='tower'&&s==='claim-monitor')return `<div class="notice"><b>Portfolio monitoring</b> — Stop Loss เป็นกรอบควบคุมพอร์ต ไม่ใช่ยอดชดเชยของเคส</div>${riskReference()}`+table(['Case','Request Status','Waiting','Next'],REQUESTS.map(r=>[r.id,r.status,r.waiting,r.next]));if(v==='driver'&&s==='help')return `<div class="card"><h3>ต้องการความช่วยเหลือ?</h3><p>ป่วย · รถเสีย · รายได้ลด → ส่งต่อเจ้าของงานก่อน ไม่ตีความเป็นเครดิตเสียอัตโนมัติ</p><button class="btn primary" onclick="go('fa','intake')">เปิด F.A. Center</button></div>`;if(v==='fa'&&s==='intake')return `<div class="card"><h3>เปิดเคส F.A.</h3><p>รับเรื่อง → คัดกรอง → แนะนำ → ส่งต่อเจ้าของอำนาจตัดสิน</p><button class="btn primary" onclick="say('สร้างเคส NEW_ALERT แล้ว')">สร้างเคส</button></div>`;if(v==='partner'&&s==='overview')return grid([['Active','476'],['WATCH','17'],['YELLOW','9'],['Open Cases','14']]);if(v==='partner'&&s==='daily')return table(['ผู้ขับ','Verified','Actual Sweep','DPD'],[['DRV-001','฿1,715.50','฿477.69','0'],['DRV-002','฿0','฿0','0']]);if(v==='partner'&&s==='ews')return `<div class="notice">Risk + Workflow + WaitingFor แยกกัน · Missing ledger ≠ Zero income</div>`;if(v==='fa'&&s==='debt-plan')return `<div class="notice">F.A. ทำ Diagnosis + Recommendation เท่านั้น · FI ตัดสินสัญญา</div>`;if(v==='fa'&&s==='income-plan')return grid([['เป้ารายได้ 7 วัน','฿12,000'],['ลดวิ่งเปล่า','8%'],['Reserve','฿300'],['ความคืบหน้า','3/7 วัน']]);return `<div class="card"><h3>${T[v][s]}</h3><p>รายละเอียดเชิงปฏิบัติการอยู่ในระบบเต็ม แต่ Competition Mode แสดงเฉพาะสิ่งที่ต้องตัดสินใจ</p><button class="btn secondary" onclick="say('บันทึก Action แล้ว')">บันทึก Action</button></div>`}
function guide(v,s){const m={'driver:home':'เริ่มจากเงินวันนี้: ดูรายได้ เงินพร้อมใช้ และยอดที่หักจริง','tower:monitor':'ดูเฉพาะเคสที่ต้องจัดการและเจ้าของงาน','fa:cases':'F.A. ช่วยก่อนเป็น NPL แต่ไม่เปลี่ยนเงื่อนไขแทน FI','partner:cure':'FI เป็นผู้ตัดสินเงื่อนไขสินเชื่อ','partner:claim':'ติดตามคำขอ + EAD / Eligible Net Loss / HMC ระดับเคส และ Stop Loss ระดับพอร์ต'};return m[v+':'+s]||'หน้ารายละเอียดสำหรับผู้ปฏิบัติงาน'}
function parse(){const x=(location.hash||'').replace('#','');if(!x||x==='gateway')return['gateway',null];const[v,s]=x.split(':');return R[v]?.includes(s)?[v,s]:['gateway',null]}
function go(v,s){location.hash=v==='gateway'?'#gateway':'#'+v+':'+s}function render(){const[v,s]=parse();document.getElementById('gateway').classList.toggle('active',v==='gateway');document.getElementById('work').classList.toggle('active',v!=='gateway');if(v==='gateway'){demoBox(false);return}document.getElementById('viewName').textContent=v==='fa'?'F.A. Center':v;document.getElementById('topTitle').textContent=T[v][s];document.getElementById('quick').innerHTML=Q[v].map(x=>`<button class="${x===s?'active':''}" onclick="go('${v}','${x}')">${T[v][x]}</button>`).join('');document.getElementById('all').innerHTML=R[v].map(x=>`<option value="${x}" ${x===s?'selected':''}>${T[v][x]}</option>`).join('');document.getElementById('content').innerHTML=`<div class="head"><h2>${T[v][s]}</h2><p>${guide(v,s)}</p></div><div class="guide"><b>ดูอะไรในหน้านี้</b><br>${guide(v,s)}</div>${body(v,s)}`;demoBox(demo)}function jumpAll(){const[v]=parse();go(v,document.getElementById('all').value)}
function startDemo(){demo=true;go(FLOW[0][0],FLOW[0][1])}function idx(){const[v,s]=parse();return FLOW.findIndex(x=>x[0]===v&&x[1]===s)}function nextDemo(){let i=idx();if(i<0)i=0;if(i===FLOW.length-1){say('จบเส้นทางสาธิต');endDemo();return}go(FLOW[i+1][0],FLOW[i+1][1])}function endDemo(){demo=false;demoBox(false);go('gateway')}function demoBox(on){const i=idx();document.getElementById('demo').classList.toggle('show',on&&i>=0);if(on&&i>=0){document.getElementById('step').textContent=`ขั้น ${i+1}/${FLOW.length}`;document.getElementById('stepText').textContent=FLOW[i][2]}}function say(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}addEventListener('hashchange',render);render();
</script></body></html>
