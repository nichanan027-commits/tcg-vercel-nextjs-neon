<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Route to Own by บสย. | Competition Final</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f8fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}#app{width:100%;height:100%;border:0;display:block;background:#f4f8fb}.loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#eef7fb);z-index:10;color:#071a33}.card{padding:28px 34px;border:1px solid #dce8ef;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(7,26,51,.12);text-align:center}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#159b6d;margin-right:7px}.hide{display:none}</style></head><body><div id="loading" class="loading"><div class="card"><b>Route to Own by บสย.</b><p><span class="dot"></span>กำลังเปิด Competition Final Back Office</p></div></div><iframe id="app" title="Route to Own Post-Approval Back Office" src="index.html#gateway"></iframe><script>(()=>{const frame=document.getElementById('app'),loading=document.getElementById('loading');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normalizeClaims(w){const rows=(w.R2O&&w.R2O.state&&w.R2O.state.claims)||[];rows.forEach((r,i)=>Object.assign(r,{requestStatus:i===0?'UNDER_REVIEW':'MORE_INFO_REQUIRED',evidenceStatus:i===0?'COMPLETE':'PENDING',recoveryStatus:i===0?'PROCEEDS_RECORDED':'IN_PROGRESS',insuranceStatus:i===0?'PROCEEDS_RECORDED':'CHECKING',owner:'TCG_CLAIM',waitingFor:i===0?'TCG':'FI',agingDays:i===0?2:4,submittedAt:i===0?'2026-09-08':'2026-09-07',lastAction:i===0?'ตรวจรับชุดเอกสารคำขอครบถ้วน':'ขอข้อมูลประกอบเพิ่มเติม',nextAction:i===0?'ติดตามผลการพิจารณาคำขอ':'ติดตามเอกสารจากผู้เกี่ยวข้อง'}));return rows}function trackingRow(r){return `<tr><td>${esc(r.id)}</td><td>${esc(r.driverId)}</td><td>${esc(r.fi)}</td><td>${esc(r.requestStatus)}</td><td>${esc(r.evidenceStatus)}</td><td>${esc(r.recoveryStatus)}</td><td>${esc(r.insuranceStatus)}</td><td>${esc(r.owner)}</td><td>${esc(r.waitingFor)}</td><td class="num">${esc(r.agingDays)} วัน</td><td>${esc(r.lastAction)}</td><td>${esc(r.nextAction)}</td></tr>`}function patch(){let w,d;try{w=frame.contentWindow;d=frame.contentDocument}catch(e){return}if(!w||!d||!w.R2O){setTimeout(patch,80);return}const rows=normalizeClaims(w);w.R2O.CLAIM_FORMULA_STATUS='TRACKING_ONLY';if(w.R2O.core){['claimRules','coverageForYear','portfolioTierBoundary','legalInitialClaimCeiling','claimContract'].forEach(k=>{try{delete w.R2O.core[k]}catch(e){}})}if(w.R2O.render)w.R2O.render.claimRow=trackingRow;const partner=d.getElementById('partner-claim');if(partner&&!partner.dataset.competitionFinal){partner.dataset.competitionFinal='1';partner.innerHTML=`<div class="title"><div><h2>คำขอรับเงินค่าชดเชย</h2><p>ติดตามสถานะคำขอ หลักฐาน การติดตามหนี้ ประกัน ผู้รับผิดชอบ และ SLA เท่านั้น</p></div></div><div class="metric-grid"><div class="metric warn"><span class="label">คำขอที่เปิดอยู่</span><div class="value">${rows.length}</div></div><div class="metric"><span class="label">หลักฐานครบ</span><div class="value">${rows.filter(r=>r.evidenceStatus==='COMPLETE').length}</div></div><div class="metric accent"><span class="label">อยู่ระหว่างพิจารณา</span><div class="value">${rows.filter(r=>r.requestStatus==='UNDER_REVIEW').length}</div></div><div class="metric"><span class="label">ขอข้อมูลเพิ่ม</span><div class="value">${rows.filter(r=>r.requestStatus==='MORE_INFO_REQUIRED').length}</div></div></div><div class="card pad tblwrap"><table class="tbl"><thead><tr><th>Case ID</th><th>Driver</th><th>FI</th><th>Request Status</th><th>Evidence</th><th>Recovery</th><th>Insurance</th><th>Owner</th><th>Waiting For</th><th>Aging</th><th>Last Action</th><th>Next Action</th></tr></thead><tbody id="partnerClaimRows"></tbody></table></div><div class="notice" style="margin-top:13px"><b>Competition Final Scope:</b> Route to Own ทำหน้าที่ track / orchestrate / monitor เท่านั้น ไม่มีสูตรคำนวณสิทธิหรือยอดเงินค่าชดเชย</div>`}const tower=d.getElementById('tower-claim-monitor');if(tower&&!tower.dataset.competitionFinal){tower.dataset.competitionFinal='1';tower.innerHTML=`<div class="title"><div><h2>Compensation Request Monitor</h2><p>ติดตาม request status · evidence · recovery · insurance · owner · waiting party · SLA</p></div></div><div class="metric-grid"><div class="metric warn"><span class="label">คำขอที่เปิดอยู่</span><div class="value">${rows.length}</div></div><div class="metric"><span class="label">Under Review</span><div class="value">${rows.filter(r=>r.requestStatus==='UNDER_REVIEW').length}</div></div><div class="metric"><span class="label">Evidence Complete</span><div class="value">${rows.filter(r=>r.evidenceStatus==='COMPLETE').length}</div></div><div class="metric"><span class="label">SLA / Aging</span><div class="value">ติดตามรายเคส</div></div></div><div class="card pad tblwrap"><table class="tbl"><thead><tr><th>Case ID</th><th>Driver</th><th>FI</th><th>Request Status</th><th>Evidence</th><th>Recovery</th><th>Insurance</th><th>Owner</th><th>Waiting For</th><th>Aging</th><th>Last Action</th><th>Next Action</th></tr></thead><tbody id="towerClaimRows"></tbody></table></div><div class="notice" style="margin-top:13px"><b>Tracking only:</b> ไม่คำนวณยอดเงินค่าชดเชยใน Control Tower</div>`}const finance=d.getElementById('partner-finance');if(finance&&!finance.dataset.competitionFinal){finance.dataset.competitionFinal='1';finance.innerHTML=`<div class="title"><div><h2>การควบคุมการเงินโครงการ</h2><p>ติดตามพอร์ต ค่าธรรมเนียม RBP เงินกันชน และสถานะการดำเนินงาน โดยแยกออกจากการพิจารณาคำขอรับเงินค่าชดเชย</p></div></div><div class="metric-grid"><div class="metric"><span class="label">RBP Tier A</span><div class="value">1.20%</div></div><div class="metric"><span class="label">RBP Tier B</span><div class="value">1.50%</div></div><div class="metric"><span class="label">RBP Tier C</span><div class="value">1.80%</div></div><div class="metric accent"><span class="label">Reserve</span><div class="value">เงินผู้ขับ</div></div></div><div class="card pad"><h3>Governance Lock</h3><p>Target ≠ Actual Sweep ≠ Contractual Due · Catch-Up ≠ DPD · Route to Own ไม่ถือเงินลูกค้า · Compensation Request เป็น workflow tracking เท่านั้น</p></div>`}const pr=d.getElementById('partnerClaimRows'),tr=d.getElementById('towerClaimRows');if(pr){const next=rows.map(trackingRow).join('');if(pr.innerHTML!==next)pr.innerHTML=next}if(tr){const next=rows.map(trackingRow).join('');if(tr.innerHTML!==next)tr.innerHTML=next}d.querySelectorAll('#tower-monitor .metric').forEach(m=>{if(/Net Loss|ผลขาดทุนสุทธิ/i.test(m.textContent||''))m.innerHTML='<span class="label">Compensation Request</span><div class="value">'+rows.length+'</div><span class="mini">tracking only</span>'});d.querySelectorAll('.chips .chip').forEach(n=>{if((n.textContent||'').includes('ควบคุมเคลม'))n.textContent='ติดตามคำขอชดเชย'});loading.classList.add('hide')}frame.addEventListener('load',()=>{patch();try{frame.contentWindow.addEventListener('hashchange',()=>setTimeout(patch,30));const rs=frame.contentDocument.getElementById('roleSelect');if(rs)rs.addEventListener('change',()=>setTimeout(patch,30))}catch(e){}});setTimeout(patch,500)})();</script></body></html>
